<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>404 — Page not found · Sanat Karkhanis</title>
  <meta name="robots" content="noindex, follow" />
  <meta name="theme-color" content="#000000" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/svg+xml" href="/assets/icons/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  <style>
    :root { --burg: #6d001a; --signal: #e3243b; --muted: rgba(255,255,255,.58); }
    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; }
    body {
      background: #000; color: #fff; font-family: "JetBrains Mono", ui-monospace, monospace;
      display: grid; place-items: center; padding: 24px; overflow: hidden;
    }
    body::before {
      content: ""; position: fixed; inset: 0; z-index: -1; opacity: .5;
      background-image: linear-gradient(rgba(214,30,56,.35) 1px, transparent 1px), linear-gradient(90deg, rgba(214,30,56,.35) 1px, transparent 1px);
      background-size: 90px 90px;
      -webkit-mask-image: radial-gradient(circle at 50% 50%, #000 0, transparent 70%); mask-image: radial-gradient(circle at 50% 50%, #000 0, transparent 70%);
    }
    main { text-align: center; max-width: 640px; }
    .code { font-family: "Archivo", "Arial Black", sans-serif; font-weight: 800; font-stretch: 112%; font-size: clamp(110px, 30vw, 260px); line-height: .8; letter-spacing: -.05em; }
    .code span { color: var(--signal); }
    p { margin-top: 24px; color: var(--muted); font-size: 13px; letter-spacing: .06em; text-transform: uppercase; line-height: 1.7; }
    a { display: inline-block; margin-top: 32px; color: #fff; text-decoration: none; border: 1px solid var(--signal); padding: 14px 20px; font-size: 13px; letter-spacing: .06em; transition: background .3s; }
    a:hover, a:focus-visible { background: var(--burg); }
  </style>
</head>
<body>
  <main>
    <p>//ERROR_LOG.TXT</p>
    <h1 class="code">4<span>0</span>4</h1>
    <p>This page isn't on the grid.</p>
    <a href="/">&gt; BACK TO SANAT_K_</a>
  </main>
</body>
</html>
